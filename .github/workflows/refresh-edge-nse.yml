name: Refresh EDGE NSE research screen

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'markets.js'
      - 'styles.css'
      - 'README.md'
      - '.github/scripts/update_nse_data.py'
      - '.github/scripts/build_market_data.py'
      - '.github/scripts/fundamentals.py'
      - '.github/scripts/conviction.py'
      - '.github/scripts/archive_nse.py'
      - '.github/scripts/momentum.py'
      - 'data/fundamentals.csv'
      - '.github/workflows/refresh-edge-nse.yml'
      - 'tests/**'
      - 'arr-market-intelligence/frontend/**'
  schedule:
    # GitHub reads these times as UTC (a timezone key is not applied here).
    # 15:47 UTC = 21:17 IST, after NSE publishes the end-of-day bhavcopy.
    # 19:47 UTC = 01:17 IST is a retry in case the first run is delayed or NSE publishes late;
    # the job is idempotent, so a second run on the same data changes nothing.
    # Off-the-hour minutes avoid GitHub's busiest (most delayed) scheduling slots.
    - cron: "47 15 * * 1-5"
    - cron: "47 19 * * 1-5"
  workflow_dispatch:
    inputs:
      force_backfill:
        description: "Rebuild up to 260 sessions from NSE archives (slower; use for initial setup or recovery)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: edge-nse-eod-refresh
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download, validate, analyze and screen NSE cash equities
        env:
          FORCE_BACKFILL: ${{ inputs.force_backfill || 'false' }}
        run: python .github/scripts/update_nse_data.py

      - name: Archive completed months for multi-year research (write-once, no downloads)
        continue-on-error: true
        run: python .github/scripts/archive_nse.py sync

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Build market explorer dataset (snapshot, breadth, per-stock charts)
        # Non-blocking: a failure here must not stop the screener from deploying.
        continue-on-error: true
        run: python .github/scripts/build_market_data.py

      - name: Commit latest history and scan results
        if: always() && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv data/latest_screen.json data/last_run.json data/etf_symbols.csv
          for f in data/index_constituents.csv data/nse_equity_list.csv data/archive data/momentum; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "No changes in history or screen output."
          else
            git commit -m "Refresh automated NSE EOD screen"
            # A re-run checks out the original commit, and an earlier attempt may already
            # have pushed data on top of it. Rebase onto the current branch before pushing.
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
              if [ "$attempt" = 3 ]; then echo "::error::Could not push refreshed data after 3 attempts"; exit 1; fi
              sleep $((attempt * 5))
            done
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static website artifact
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/data
          cp index.html app.js markets.js styles.css .nojekyll _site/
          cp -R assets/. _site/assets/
          mkdir -p _site/arr-market-intelligence
          cp -R arr-market-intelligence/frontend/. _site/arr-market-intelligence/
          cp data/latest_screen.json _site/data/latest_screen.json
          if [ -f data/market/snapshot.json ]; then cp -R data/market _site/data/market; else echo "::warning::Market explorer dataset missing; explorer views will show a notice."; fi

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Deploy in a separate job (GitHub's Pages pattern). Deploying in the same job as the
  # upload intermittently failed with "No artifacts named github-pages were found" because
  # the artifact was not yet listed; a dependent job starts only after the upload is final.
  deploy:
    needs: refresh-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
